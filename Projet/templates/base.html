<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>YOUTOUBE | {% block title %}{% endblock %}</title>
		<link rel="stylesheet" type="text/css" href="{{url_for('static',filename='CSS/style.css')}}">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<script src="{{url_for('static',filename='js/navBar.js')}}"></script>
		<script src="{{url_for('static',filename='js/videoManager.js')}}"></script>
	</head>
	<body>
		{% block contenu0 %}{% endblock %}
		  
		  <!-- Add all page content inside this div if you want the side nav to push page content to the right (not used if you only want the sidenav to sit on top of the page -->
		  <div id="main">
			<div class="topnav">
				{% block contenu1 %}{% endblock %}
		
				<h1>YOUTOUBE</h1>
				<form action="/search" method="POST">
					<input type="text" name="query" placeholder="Search on Youtoube..." value="{{query}}">
				</form>
			  </div>

			  <!--POPUP DE LOGIN-->
			  <div id="myPopup" class="popup">
				<div class="divclose">
					<a href="javascript:void(0)" class="closebtn" onclick="closeLoginScreen()">&times;</a>
				</div>
				<div class="logdiv">
					<form action="/login" method="POST">
						<h2>LOGIN</h2>
						<div class="field">
							<label>USERNAME</label>
							<input type="text" name="login" placeholder="Enter your username">
						</div>
						<div class="field">
							<label>PASSWORD</label>
							<input type="text" name="password" placeholder="Enter your password">
						</div>
						
						{% block currentPage %}	{% endblock %}
						<div>
							<input type="submit" value="LOGIN">
						</div>
						<div>
							<label>Don't have an account ? <a href="/signup">SIGN UP</a></label>
						</div>
						
					</form>
				</div>
				
				
			  </div>
			  {% block contenu2 %}{% endblock %}
		  </div>
		
	</body>
</html>
